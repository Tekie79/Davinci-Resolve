name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speaker-marker dependencies
        run: python -m pip install -r requirements-speaker-markers.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
